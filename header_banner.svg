<svg fill="none" viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="220" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="160" cy="70" r="110" fill="url(#glow)" filter="url(#glowFilter)" />
  <circle cx="740" cy="150" r="130" fill="url(#glow)" filter="url(#glowFilter)" />

  <!-- Smooth Ambient Waves -->
  <path d="M0 165 C 220 130, 420 205, 620 155 C 750 120, 840 170, 900 155 L 900 220 L 0 220 Z" fill="#1e293b" fill-opacity="0.4" />
  <path d="M0 185 C 260 150, 520 215, 720 175 C 810 155, 870 190, 900 180 L 900 220 L 0 220 Z" fill="#2563eb" fill-opacity="0.18" />

  <!-- Geometric Tech Dots Grid -->
  <g fill="#38bdf8" opacity="0.35">
    <circle cx="45" cy="45" r="2" />
    <circle cx="65" cy="45" r="2" />
    <circle cx="85" cy="45" r="2" />
    <circle cx="45" cy="65" r="2" />
    <circle cx="65" cy="65" r="2" />
    <circle cx="85" cy="65" r="2" />
    <circle cx="815" cy="45" r="2" />
    <circle cx="835" cy="45" r="2" />
    <circle cx="855" cy="45" r="2" />
    <circle cx="815" cy="65" r="2" />
    <circle cx="835" cy="65" r="2" />
    <circle cx="855" cy="65" r="2" />
  </g>

  <!-- Title Text -->
  <text x="450" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="2">
    MARYAM NOOR
  </text>

  <!-- Role Subtitle with Gradient -->
  <text x="450" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="url(#accent)" letter-spacing="1">
    Senior AI/ML &amp; Full-Stack Engineer
  </text>

  <!-- Specialization Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    <rect x="130" y="146" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="202" y="164" fill="#38bdf8">Generative AI &amp; RAG</text>

    <rect x="290" y="146" width="155" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="367" y="164" fill="#818cf8">Cloud-Native MLOps</text>

    <rect x="460" y="146" width="165" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="542" y="164" fill="#a78bfa">Distributed Streaming</text>

    <rect x="640" y="146" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="705" y="164" fill="#34d399">Full-Stack APIs</text>
  </g>
</svg>